<!DOCTYPE html>
<html lang="en-US">
  <meta charset="utf-8">
  <title>Redirecting&hellip;</title>
  <link rel="canonical" href="{{ page.redirect.to }}">
  <meta name="robots" content="noindex">
  {%- comment -%}
    Keeps the #section of an old link, so a deep link lands on the same section of the moved page.
    The meta refresh cannot carry it, so it only runs when JavaScript is off.
  {%- endcomment %}
  <script>location.replace({{ page.redirect.to | jsonify }} + location.hash)</script>
  <noscript><meta http-equiv="refresh" content="0; url={{ page.redirect.to }}"></noscript>
  <h1>Redirecting&hellip;</h1>
  <a href="{{ page.redirect.to }}">Click here if you are not redirected.</a>
</html>
